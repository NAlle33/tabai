name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CCMCP_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
        env:
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-browser-logs
          path: ${{ runner.temp }}/ccmcp-cilog-*
          if-no-files-found: ignore
